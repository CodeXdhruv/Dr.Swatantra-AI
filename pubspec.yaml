name: muktiya_new
description: "Dr. Swatantra AI - Kalpavriksha AI for Global Welfare. A revolutionary AI assistant for spiritual growth, wellness, and global healing."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  
  # Core dependencies - UPDATED for security & stability
  provider: ^6.1.2
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.2
  firebase_crashlytics: ^4.1.4  # ADDED: Crash reporting for Play Store
  google_sign_in: ^6.2.1
  
  # Voice functionality - UPDATED for compatibility
  speech_to_text: ^7.3.0
  flutter_tts: ^4.1.0
  
  # AI and network - UPDATED for security
  google_generative_ai: ^0.4.7
  http: ^1.2.1
  flutter_dotenv: ^5.2.1
  
  # Image picker - UPDATED for security
  image_picker: ^1.1.2
  
  # UI and utilities - UPDATED for performance
  url_launcher: ^6.3.0
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    # ESSENTIAL: App branding & launch
    - assets/app_logo.png          # 229KB - App icon
    - assets/splash.png            # 163KB - Splash screen
    
    # CORE: App functionality
    - assets/quotes.json           # 2KB - Daily quotes
    - assets/book.txt              # 281KB - RAG knowledge base
    - .env                         # Environment variables
    
    # UI: Content images (OPTIMIZED)
    - assets/deviahilya.png        # 257KB - Profile content
    - assets/swatantra_ai_book.png # 212KB - Book cover
    - assets/universal_prosperity.png # 629KB - Content image
    - assets/timeless_path.png     # 729KB - Content image
    
    # REMOVED ASSETS:
    # - assets/app_logo.svg (380KB - SVG not needed with PNG)
    # - assets/counselling.png (206KB - duplicate functionality)
    # - assets/slide4.png (206KB - unused in current build)
    # - Large unused assets in assets/ folder

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_logo.svg"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/app_logo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/app_logo.png"
    icon_size: 48